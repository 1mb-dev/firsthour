version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Types describe the runtime: engines and CI are Node 22, so newer majors would type-check APIs it lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
