<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>firsthour</title>
    <meta name="description" content="Fresh remote roles from Hacker News and the companies hiring there, while they are still new." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header>
      <h1>firsthour</h1>
      <p class="tagline">Fresh remote roles from Hacker News and the companies hiring there.</p>
      <p id="status" class="status" aria-live="polite"></p>
    </header>
    <main>
      <label for="q" class="visually-hidden">Filter</label>
      <input id="q" type="search" placeholder="Filter: go, backend, -onsite" autocomplete="off" spellcheck="false" />
      <p id="count" class="count" aria-live="polite"></p>
      <div id="notice"></div>
      <div id="list" aria-busy="true"><p class="muted">Loading…</p></div>
    </main>
    <footer>
      <p>Links go to the original post or job board. Never pay to apply.</p>
      <p><a href="https://github.com/1mb-dev/firsthour">Source</a></p>
    </footer>
  </body>
</html>
